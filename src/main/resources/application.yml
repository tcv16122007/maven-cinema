spring:
  application:
    name: maven-cinema

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=MovieBookingDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: sa
    password: 161207
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8084
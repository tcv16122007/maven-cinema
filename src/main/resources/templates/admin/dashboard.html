<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Admin Dashboard')}"></th:block>
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>
        <main class="admin-content flex-grow-1">
            <h2 class="fw-bold mb-4">📊 Dashboard</h2>

            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-value" th:text="${totalMovies}">0</div>
                        <div class="stat-label">Phim</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-value" th:text="${totalUsers}">0</div>
                        <div class="stat-label">Người dùng</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-value" th:text="${totalTickets}">0</div>
                        <div class="stat-label">Vé đã bán</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-value" th:text="${#numbers.formatDecimal(totalRevenue, 0, 0, 'COMMA')} + 'đ'">
                            0đ</div>
                        <div class="stat-label">Doanh thu</div>
                    </div>
                </div>
            </div>

            <div class="cinema-card p-4">
                <h5 class="mb-3">🎟️ 10 vé gần đây</h5>
                <div th:if="${#lists.isEmpty(recentTickets)}" class="text-secondary-cinema">
                    Chưa có vé nào.
                </div>
                <table th:if="${!#lists.isEmpty(recentTickets)}" class="table table-cinema">
                    <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Khách</th>
                            <th>Phim</th>
                            <th>Ghế</th>
                            <th>Tổng</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${recentTickets}">
                            <td>#<span th:text="${t.id}"></span></td>
                            <td th:text="${t.user.fullName}">-</td>
                            <td th:text="${t.showtime.movie.title}">-</td>
                            <td th:text="${t.seatNumber}">-</td>
                            <td th:text="${#numbers.formatDecimal(t.totalPrice, 0, 0, 'COMMA')} + 'đ'">0đ</td>
                            <td><span class="badge-cinema badge-success" th:text="${t.status.display}">-</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

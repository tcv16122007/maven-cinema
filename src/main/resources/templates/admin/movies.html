<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Quản lý phim')}"></th:block>
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar('movies')}"></div>
        <main class="admin-content flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">🎬 Quản lý phim</h2>
                <a th:href="@{/admin/movies/new}" class="btn btn-cinema">
                    <i class="bi bi-plus-lg"></i> Thêm phim
                </a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="cinema-card p-3 mb-3">
                <form th:action="@{/admin/movies}" method="get" class="d-flex">
                    <input class="form-control me-2" type="search" name="keyword" th:value="${keyword}"
                        placeholder="Tìm theo tên phim...">
                    <button class="btn btn-outline-cinema" type="submit">Tìm</button>
                </form>
            </div>

            <div class="cinema-card p-3">
                <div th:if="${#lists.isEmpty(movies)}" class="text-secondary-cinema text-center py-4">
                    Chưa có phim nào. Bấm "Thêm phim" để tạo mới.
                </div>
                <table th:if="${!#lists.isEmpty(movies)}" class="table table-cinema">
                    <thead>
                        <tr>
                            <th style="width:80px">Poster</th>
                            <th>Tên phim</th>
                            <th>Thể loại</th>
                            <th>Thời lượng</th>
                            <th>Trạng thái</th>
                            <th style="width:180px">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${movies}">
                            <td>
                                <img th:src="${m.posterUrl}"
                                    style="width:60px;height:90px;object-fit:cover;border-radius:4px;"
                                    onerror="this.src='https://placehold.co/60x90/1E1E1E/E50914?text=No+Img'">
                            </td>
                            <td class="fw-semibold" th:text="${m.title}">-</td>
                            <td th:text="${m.category != null ? m.category.name : '-'}">-</td>
                            <td><span th:text="${m.duration}">0</span> phút</td>
                            <td><span class="badge-cinema badge-warning" th:text="${m.status.display}">-</span></td>
                            <td>
                                <a th:href="@{/admin/movies/edit/{id}(id=${m.id})}"
                                    class="btn btn-sm btn-outline-cinema">
                                    <i class="bi bi-pencil"></i> Sửa
                                </a>
                                <form th:action="@{/admin/movies/delete/{id}(id=${m.id})}" method="post"
                                    class="d-inline" onsubmit="return confirm('Xóa phim này?');">
                                    <button class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i> Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

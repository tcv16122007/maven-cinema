<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Quản lý phim')}"></th:block>
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar Admin -->
        <div th:replace="~{fragments/sidebar :: sidebar('movies')}"></div>

        <!-- Nội dung chính -->
        <main class="admin-content flex-grow-1">
            <!-- Tiêu đề & Nút thêm -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">🎬 Quản lý phim</h2>
                <a th:href="@{/admin/movies/new}" class="btn btn-cinema">
                    <i class="bi bi-plus-lg"></i> Thêm phim
                </a>
            </div>

            <!-- Thông báo -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Thanh tìm kiếm (Không bọc trong cinema-card, chỉ giới hạn độ rộng) -->
            <form th:action="@{/admin/movies}" method="get" class="d-flex mb-4" style="max-width: 450px;">
                <input class="form-control me-2" type="search" name="keyword" th:value="${keyword}"
                    placeholder="Nhập tên phim cần tìm...">
                <button class="btn btn-outline-cinema px-4" type="submit">Tìm</button>
            </form>

            <!-- Bảng danh sách phim -->
            <div class="cinema-card p-3">
                <!-- Nếu danh sách rỗng -->
                <div th:if="${#lists.isEmpty(movies)}" class="text-center py-5 text-secondary-cinema">
                    <h4>Chưa có phim nào</h4>
                    <p class="mb-0">Bấm nút "Thêm phim" ở góc trên để bắt đầu.</p>
                </div>

                <!-- Nếu có dữ liệu -->
                <table th:if="${not #lists.isEmpty(movies)}" class="table table-cinema mb-0">
                    <thead>
                        <tr>
                            <th style="width:80px">Poster</th>
                            <th>Tên phim</th>
                            <th>Thể loại</th>
                            <th>Thời lượng</th>
                            <th>Trạng thái</th>
                            <th style="width:180px">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${movies}">
                            <td>
                                <!-- Ảnh Poster -->
                                <img th:src="${m.posterUrl != null && !m.posterUrl.isEmpty() ? m.posterUrl : 'https://placehold.co/60x90/1E1E1E/E50914?text=No+Img'}"
                                    style="width:60px;height:90px;object-fit:cover;border-radius:4px;"
                                    onerror="this.src='https://placehold.co/60x90/1E1E1E/E50914?text=Error'">
                            </td>
                            <td class="fw-semibold text-white" th:text="${m.title}">Tên phim</td>
                            <td th:text="${m.category != null ? m.category.name : '-'}">Thể loại</td>
                            <td><span th:text="${m.duration}">120</span> phút</td>
                            <td>
                                <span class="badge-cinema badge-warning" th:text="${m.status.display}">Trạng thái</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/movies/edit/{id}(id=${m.id})}"
                                    class="btn btn-sm btn-outline-cinema">
                                    <i class="bi bi-pencil"></i> Sửa
                                </a>
                                <form th:action="@{/admin/movies/delete/{id}(id=${m.id})}" method="post"
                                    class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa phim này?');">
                                    <button class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i> Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

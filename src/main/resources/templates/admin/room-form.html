<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Thêm/Sửa phòng')}"></th:block>
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar('rooms')}"></div>
        <main class="admin-content flex-grow-1">
            <h2 class="fw-bold mb-4" th:text="${isEdit} ? '✏️ Sửa phòng' : '➕ Thêm phòng'">Form</h2>
            <div class="cinema-card p-4" style="max-width:600px;">
                <form th:action="@{/admin/rooms/save}" th:object="${room}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label">Tên phòng *</label>
                        <input type="text" th:field="*{name}" class="form-control" required
                            placeholder="VD: Phòng 1, IMAX...">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Sức chứa (số ghế) *</label>
                        <input type="number" th:field="*{capacity}" class="form-control" required min="10" max="200">
                    </div>
                    <button type="submit" class="btn btn-cinema"><i class="bi bi-check-lg"></i> Lưu</button>
                    <a th:href="@{/admin/rooms}" class="btn btn-outline-cinema">Hủy</a>
                </form>
            </div>
        </main>
    </div>
</body>

</html>

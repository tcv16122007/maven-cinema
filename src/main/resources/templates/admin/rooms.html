<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Quản lý phòng')}"></th:block>
</head>

<body>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar('rooms')}"></div>
        <main class="admin-content flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">🚪 Quản lý phòng chiếu</h2>
                <a th:href="@{/admin/rooms/new}" class="btn btn-cinema"><i class="bi bi-plus-lg"></i> Thêm phòng</a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="cinema-card p-3">
                <table class="table table-cinema">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên phòng</th>
                            <th>Sức chứa</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${rooms}">
                            <td th:text="${r.id}">1</td>
                            <td class="fw-semibold" th:text="${r.name}">Phòng 1</td>
                            <td><span th:text="${r.capacity}">80</span> ghế</td>
                            <td>
                                <a th:href="@{/admin/rooms/edit/{id}(id=${r.id})}"
                                    class="btn btn-sm btn-outline-cinema"><i class="bi bi-pencil"></i> Sửa</a>
                                <form th:action="@{/admin/rooms/delete/{id}(id=${r.id})}" method="post" class="d-inline"
                                    onsubmit="return confirm('Xóa phòng này?');">
                                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i>
                                        Xóa</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Đăng ký')}"></th:block>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1><i class="bi bi-camera-reels-fill"></i> ĐĂNG KÝ</h1>
            <p class="text-center text-secondary-cinema mb-4">Tạo tài khoản mới</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/auth/register}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập *</label>
                    <input type="text" th:field="*{username}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu *</label>
                    <input type="password" th:field="*{password}" class="form-control" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" th:field="*{fullName}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control">
                </div>
                <div class="mb-4">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control">
                </div>
                <button type="submit" class="btn btn-cinema w-100 mb-3">Đăng ký</button>
            </form>

            <p class="text-center text-secondary-cinema small mb-0">
                Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a>
            </p>
            <p class="text-center text-secondary-cinema small mt-2">
                <a th:href="@{/}"><i class="bi bi-arrow-left"></i> Về trang chủ</a>
            </p>
        </div>
    </div>
</body>

</html>

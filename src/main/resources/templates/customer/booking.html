<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Đặt vé')}"></th:block>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 mt-4">
        <div class="row g-4">
            <div class="col-md-8">
                <div class="cinema-card p-4">
                    <h3 class="mb-3" th:text="${showtime.movie.title}">Tên phim</h3>
                    <p class="text-secondary-cinema mb-1">
                        <i class="bi bi-geo-alt-fill text-danger"></i>
                        <span th:text="${showtime.room.name}">Phòng</span>
                        &nbsp;•&nbsp;
                        <i class="bi bi-clock-fill text-danger"></i>
                        <span th:text="${#temporals.format(showtime.startTime, 'HH:mm - dd/MM/yyyy')}">Giờ</span>
                    </p>

                    <div class="text-center mt-4 mb-3" style="color:#AAAAAA;font-size:13px;">MÀN HÌNH</div>
                    <div
                        style="height:8px;background:linear-gradient(90deg,transparent,#E50914,transparent);border-radius:4px;margin-bottom:30px;">
                    </div>

                    <div class="seat-grid" th:style="'grid-template-columns: repeat(' + ${cols} + ', 36px);'">
                        <div th:each="seat : ${seats}"
                            th:class="'seat ' + (${#lists.contains(bookedSeats, seat)} ? 'occupied' : '')"
                            th:attr="data-seat=${seat}, data-price=${showtime.price}" th:text="${seat}"></div>
                    </div>

                    <div class="seat-legend">
                        <span><span class="box" style="background:#2a2a2a;"></span>Trống</span>
                        <span><span class="box" style="background:#E50914;"></span>Đã chọn</span>
                        <span><span class="box" style="background:#444;"></span>Đã đặt</span>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="cinema-card p-4 sticky-top" style="top:90px;">
                    <h5 class="mb-3">Thông tin đặt vé</h5>
                    <p class="text-secondary-cinema small mb-1">
                        <i class="bi bi-ticket-perforated"></i> Giá mỗi ghế:
                        <strong style="color:#E50914"
                            th:text="${#numbers.formatDecimal(showtime.price, 0, 0, 'COMMA')} + 'đ'">0đ</strong>
                    </p>
                    <hr style="border-color:#333;">
                    <p class="mb-1">Ghế đã chọn: <span id="selectedSeats" style="color:#E50914;font-weight:600;">Chưa
                            chọn</span></p>
                    <p class="mb-3">Tổng tiền: <span id="totalPrice"
                            style="color:#E50914;font-size:22px;font-weight:800;">0đ</span></p>

                    <form th:action="@{/booking}" method="post" id="bookingForm">
                        <input type="hidden" name="showtimeId" th:value="${showtime.id}">
                        <input type="hidden" name="seats" id="seatsInput">
                        <button type="submit" class="btn btn-cinema w-100" id="submitBtn" disabled>
                            <i class="bi bi-check-circle"></i> Xác nhận đặt vé
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/seat-booking.js}"></script>
</body>

</html>

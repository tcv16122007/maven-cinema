<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Vé của tôi')}"></th:block>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 mt-4">
        <h2 class="fw-bold mb-4">Vé của tôi</h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${#lists.isEmpty(tickets)}" class="text-center py-5 text-secondary-cinema">
            <h3>Bạn chưa có vé nào</h3>
            <a th:href="@{/movies}" class="btn btn-cinema mt-3">Đặt vé ngay</a>
        </div>

        <div th:if="${!#lists.isEmpty(tickets)}" class="table-responsive">
            <table class="table table-cinema">
                <thead>
                    <tr>
                        <th>Mã vé</th>
                        <th>Phim</th>
                        <th>Suất chiếu</th>
                        <th>Ghế</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${tickets}">
                        <td>#<span th:text="${t.id}">1</span></td>
                        <td th:text="${t.showtime.movie.title}">Phim</td>
                        <td>
                            <span th:text="${#temporals.format(t.showtime.startTime, 'HH:mm dd/MM/yyyy')}">--</span>
                            <br>
                            <small class="text-secondary-cinema" th:text="${t.showtime.room.name}">Phòng</small>
                        </td>
                        <td><strong th:text="${t.seatNumber}">A1</strong></td>
                        <td th:text="${#numbers.formatDecimal(t.totalPrice, 0, 0, 'COMMA')} + 'đ'">0đ</td>
                        <td>
                            <span th:if="${t.status.name() == 'PAID'}" class="badge-cinema badge-success">Đã thanh
                                toán</span>
                            <span th:if="${t.status.name() == 'CANCELLED'}" class="badge-cinema badge-secondary">Đã
                                hủy</span>
                            <span th:if="${t.status.name() == 'PENDING'}" class="badge-cinema badge-warning">Chờ thanh
                                toán</span>
                        </td>
                        <td>
                            <form th:if="${t.status.name() == 'PAID'}" th:action="@{/bookings/cancel/{id}(id=${t.id})}"
                                method="post" class="d-inline"
                                onsubmit="return confirm('Bạn có chắc muốn hủy vé này?');">
                                <button class="btn btn-sm btn-outline-danger">Hủy vé</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

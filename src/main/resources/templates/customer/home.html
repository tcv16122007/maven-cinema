<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Trang chủ')}"></th:block>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Hero banner -->
    <section class="py-5" style="background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);">
        <div class="container text-center py-4">
            <h1 class="display-4 fw-bold mb-3" style="color:#E50914">
                <i class="bi bi-camera-reels-fill"></i> RAVEN CINEMA
            </h1>
            <p class="lead text-secondary-cinema mb-4">Trải nghiệm điện ảnh đỉnh cao tại rạp của chúng tôi</p>
            <a th:href="@{/movies}" class="btn btn-cinema btn-lg px-4">
                <i class="bi bi-ticket-perforated"></i> Đặt vé ngay
            </a>
        </div>
    </section>

    <!-- Now showing -->
    <section class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h3 fw-bold mb-0 text-white">🎬 Phim đang chiếu</h2>
            <a th:href="@{/movies}" class="btn btn-outline-cinema btn-sm">Xem tất cả <i
                    class="bi bi-arrow-right"></i></a>
        </div>

        <div class="row g-4" th:if="${not #lists.isEmpty(nowShowing)}">
            <div class="col-6 col-md-4 col-lg-3" th:each="movie : ${nowShowing}">
                <!-- SỬA TẠI ĐÂY: Dùng onclick để chuyển trang -->
                <div class="cinema-card h-100" style="cursor: pointer;"
                    th:onclick="'window.location.href=\'' + @{/movies/{id}(id=${movie.id})} + '\''">

                    <img th:src="${movie.posterUrl}" th:alt="${movie.title}" class="movie-poster"
                        onerror="this.src='https://placehold.co/300x450/1E1E1E/E50914?text=No+Img'">
                    <div class="p-3">
                        <h5 class="mb-2 text-white text-truncate" th:text="${movie.title}">Title</h5>
                        <p class="text-secondary-cinema small mb-0">
                            <i class="bi bi-clock"></i>
                            <span th:text="${movie.duration}">120</span> phút
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(nowShowing)}" class="text-secondary-cinema">Chưa có phim đang chiếu.</p>
    </section>

    <!-- Coming soon -->
    <section class="container pb-5">
        <h2 class="h3 fw-bold mb-4 text-white">🚀 Phim sắp chiếu</h2>
        <div class="row g-4" th:if="${not #lists.isEmpty(comingSoon)}">
            <div class="col-6 col-md-4 col-lg-3" th:each="movie : ${comingSoon}">
                <!-- SỬA TẠI ĐÂY: Dùng onclick để chuyển trang -->
                <div class="cinema-card h-100" style="cursor: pointer;"
                    th:onclick="'window.location.href=\'' + @{/movies/{id}(id=${movie.id})} + '\''">

                    <img th:src="${movie.posterUrl}" th:alt="${movie.title}" class="movie-poster"
                        onerror="this.src='https://placehold.co/300x450/1E1E1E/E50914?text=No+Img'">
                    <div class="p-3">
                        <h5 class="mb-2 text-white text-truncate" th:text="${movie.title}">Title</h5>
                        <p class="text-secondary-cinema small mb-0">
                            <i class="bi bi-calendar"></i>
                            <span
                                th:text="${movie.releaseDate != null ? #temporals.format(movie.releaseDate, 'dd/MM/yyyy') : 'Sắp ra mắt'}">01/01/2026</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(comingSoon)}" class="text-secondary-cinema">Chưa có phim sắp chiếu.</p>
    </section>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Danh sách phim')}"></th:block>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Tất cả phim</h2>
            <form class="d-flex" th:action="@{/movies}" method="get">
                <input class="form-control me-2" type="search" name="keyword" th:value="${keyword}"
                    placeholder="Tìm tên phim...">
                <button class="btn btn-cinema" type="submit">Tìm</button>
            </form>
        </div>

        <div class="row g-4" th:if="${!#lists.isEmpty(movies)}">
            <div class="col-6 col-md-4 col-lg-3" th:each="movie : ${movies}">
                <a th:href="@{/movies/{id}(id=${movie.id})}" class="text-decoration-none">
                    <div class="cinema-card h-100">
                        <img th:src="${movie.posterUrl}" th:alt="${movie.title}" class="movie-poster">
                        <div class="p-3">
                            <h5 class="mb-2 text-white text-truncate" th:text="${movie.title}">Title</h5>
                            <p class="text-secondary-cinema small mb-1">
                                <i class="bi bi-tag"></i> <span th:text="${movie.category.name}">Thể loại</span>
                            </p>
                            <p class="text-secondary-cinema small mb-0">
                                <i class="bi bi-clock"></i> <span th:text="${movie.duration}">120</span> phút
                            </p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(movies)}" class="text-center py-5 text-secondary-cinema">
            <h3>Không tìm thấy phim nào!</h3>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dark Cinema</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #121212;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #1E1E1E;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            max-width: 480px;
        }

        h1 {
            color: #E50914;
            margin: 0 0 20px;
            font-size: 28px;
            line-height: 1.3;
        }

        p {
            color: #AAAAAA;
            margin: 8px 0;
            font-size: 15px;
        }

        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: #E50914;
            color: #FFFFFF;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1 th:text="${message}">Dark Cinema</h1>
        <p>MSSV: <span th:text="${studentId}">PD12863</span></p>
        <p>Trang test kết nối SQL Server + Thymeleaf</p>
        <span class="badge">Phase 1 — Setup OK</span>
    </div>
</body>

</html>

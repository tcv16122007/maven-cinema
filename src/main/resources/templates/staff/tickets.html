<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <th:block th:replace="~{fragments/head :: head('Quầy vé')}"></th:block>
</head>

<body>
    <div class="d-flex">
        <!-- Dùng staffSidebar thay vì sidebar của Admin -->
        <div th:replace="~{fragments/staff-sidebar :: staffSidebar('tickets')}"></div>

        <main class="admin-content flex-grow-1">
            <h2 class="fw-bold mb-4 text-white">🎟️ Quầy bán vé & Hỗ trợ</h2>

            <!-- Thông báo -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Tìm kiếm vé -->
            <form th:action="@{/staff/tickets}" method="get" class="d-flex mb-4" style="max-width: 500px;">
                <input class="form-control me-2" type="search" name="keyword" th:value="${keyword}"
                    placeholder="Nhập Mã vé, Tên khách hoặc Username...">
                <button class="btn btn-cinema px-4" type="submit">Tra cứu</button>
            </form>

            <div class="cinema-card p-3">
                <div th:if="${#lists.isEmpty(tickets)}" class="text-center py-4 text-secondary-cinema">
                    Không tìm thấy vé nào phù hợp.
                </div>

                <table th:if="${not #lists.isEmpty(tickets)}" class="table table-cinema">
                    <thead>
                        <tr>
                            <th>Mã vé</th>
                            <th>Khách hàng</th>
                            <th>Phim / Suất chiếu</th>
                            <th>Ghế</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${tickets}">
                            <td><strong>#<span th:text="${t.id}"></span></strong></td>
                            <td>
                                <span class="text-white fw-semibold" th:text="${t.user.fullName}"></span><br>
                                <small class="text-secondary-cinema" th:text="${t.user.phone}"></small>
                            </td>
                            <td>
                                <span class="text-white" th:text="${t.showtime.movie.title}"></span><br>
                                <small class="text-secondary-cinema"
                                    th:text="${#temporals.format(t.showtime.startTime, 'HH:mm - dd/MM')} + ' | ' + ${t.showtime.room.name}"></small>
                            </td>
                            <td style="font-size: 18px; color: #E50914; font-weight: bold;" th:text="${t.seatNumber}">
                            </td>
                            <td>
                                <span th:if="${t.status.name() == 'PAID'}" class="badge-cinema badge-success">Đã
                                    TT</span>
                                <span th:if="${t.status.name() == 'CHECKED_IN'}" class="badge-cinema badge-warning">Đã
                                    vào</span>
                                <span th:if="${t.status.name() == 'CANCELLED'}" class="badge-cinema badge-secondary">Đã
                                    hủy</span>
                            </td>
                            <td>
                                <!-- Nút Check-in -->
                                <form th:if="${t.status.name() == 'PAID'}"
                                    th:action="@{/staff/tickets/checkin/{id}(id=${t.id})}" method="post"
                                    class="d-inline">
                                    <button class="btn btn-sm btn-cinema"
                                        onclick="return confirm('Xác nhận cho khách vào rạp?');">
                                        <i class="bi bi-check2-circle"></i> Check-in
                                    </button>
                                </form>

                                <!-- Nút Hủy vé -->
                                <form th:if="${t.status.name() == 'PAID'}"
                                    th:action="@{/staff/tickets/cancel/{id}(id=${t.id})}" method="post" class="d-inline"
                                    onsubmit="return confirm('Xác nhận hủy vé này để nhường ghế cho khách khác?');">
                                    <button class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x-circle"></i> Hủy
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
